server:
  port: 8082

spring:
  application:
    name: document-service # Assigns a logical name to this application context for identification
  profiles:
    active: local # Activates the local processing profile; change this to 'aws' when migrating to the cloud

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true # <--- ADD THIS
      # Alternatively, you can force it to use localhost:
      # hostname: localhost