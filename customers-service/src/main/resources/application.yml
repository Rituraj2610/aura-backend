server:
  port: 8083
spring:
  application:
    name: customers-service
  webflux:
    base-path: /customers
  ai:
    mcp:
      server:
        protocol: STREAMABLE


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

